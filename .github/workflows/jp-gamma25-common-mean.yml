name: JP gamma2.5 common-mean experiment

on:
  push:
    branches:
      - agent/jp-gamma25-common-mean

permissions:
  contents: write

jobs:
  recompute:
    if: ${{ !contains(github.event.head_commit.message, '[skip jp gamma25]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Recompute Japanese gamma2.5 common-mean analysis
        run: python experiments/jp_gamma25_common_mean/recompute_main_analysis.py
      - name: Commit experiment outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/jp_gamma25_common_mean figs/jp_gamma25_common_mean
          git commit -m 'Store Japanese gamma2.5 common-mean outputs [skip jp gamma25]'
          git push origin HEAD:agent/jp-gamma25-common-mean
