name: One-time synchronize from Japanese source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.head_commit.message == 'Prepare one-time ICA2026 repository synchronization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the English repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the fixed Japanese source snapshot
        run: |
          git clone --depth 1 https://github.com/yoshi123027-del/dc-glidepath-ica2026.git /tmp/ica2026-ja
          test "$(git -C /tmp/ica2026-ja rev-parse HEAD)" = "ef479144d38371e46aba70cf5b0405554d2c243f"

      - name: Replace the worktree with the source snapshot
        run: |
          rsync -a --delete --exclude .git /tmp/ica2026-ja/ ./

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify the synchronized code
        run: |
          python -m compileall -q recalibration
          python recalibration/test_evaluator_comparison.py

      - name: Commit and push the synchronized snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize repository structure with Japanese source ef479144"
          git push origin HEAD:main
