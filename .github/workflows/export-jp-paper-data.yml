name: Export JP x-max data
on:
  push:
    branches: [agent/jp-gamma25-common-mean]
permissions:
  contents: write
jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[skip export jp]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Recompute recalibrated dTCMV x-max sensitivity
        run: |
          python - <<'PY'
          import importlib.util, json, math, sys
          import numpy as np, pandas as pd
          from pathlib import Path
          coef=json.loads(Path('results/jp_gamma25_common_mean/refined_equal_mean_coefficients.json').read_text())
          z=np.load('results/jp_gamma25_common_mean/mv_policy_arrays.npz',allow_pickle=True)
          roll_path=Path('scripts/03_rolling/recompute_d0_rolling.py')
          spec=importlib.util.spec_from_file_location('rollmod',roll_path)
          roll=importlib.util.module_from_spec(spec); sys.modules['rollmod']=roll; spec.loader.exec_module(roll)
          base=np.asarray(z['xg_tc'],float)
          def upper_cvar(grid,p,alpha=.05):
              p=np.asarray(p,float); p=p/p.sum(); rem=alpha; total=0.0
              for v,w in zip(grid[::-1],p[::-1]):
                  take=min(rem,w); total+=take*v; rem-=take
                  if rem<=1e-15: break
              return total/alpha
          rows=[]
          for xmax in [300,600,900]:
              gx=base if xmax==300 else np.concatenate([base,np.arange(302.0,float(xmax)+1e-9,2.0)])
              M,Q,P=roll.solve_tc(1,roll.N,gx,roll.H,roll.dt,roll.r,roll.beta,roll.sigma,roll.c,roll.D,float(coef['gamma_c']),float(coef['rho_d']),roll.n_controls,roll.gh_x,roll.gh_w)
              pmf,glide,upper=roll.forward_policy(roll.N,gx,roll.x0,0,P,roll.dt,roll.r,roll.beta,roll.sigma,roll.c,roll.gh_x,roll.gh_w)
              p=pmf[-1]/pmf[-1].sum(); mean=float(p@gx); sd=math.sqrt(max(float(p@((gx-mean)**2)),0.0))
              rows.append(dict(x_max=xmax,rho_d=float(coef['rho_d']),mean=mean,stdev=sd,ucvar95=upper_cvar(gx,p),avg_glide=float(np.mean(glide)),terminal_upper_mass=float(p[-1])))
          out=Path('results/jp_gamma25_common_mean/paper_export/dtcmv_xmax_sensitivity.csv'); out.parent.mkdir(parents=True,exist_ok=True)
          pd.DataFrame(rows).to_csv(out,index=False)
          print(pd.DataFrame(rows).to_string(index=False))
          PY
          cp results/jp_gamma25_common_mean/paper_export/dtcmv_xmax_sensitivity.csv /tmp/dtcmv_xmax_sensitivity.csv
      - name: Commit export only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD
          mkdir -p results/jp_gamma25_common_mean/paper_export
          cp /tmp/dtcmv_xmax_sensitivity.csv results/jp_gamma25_common_mean/paper_export/dtcmv_xmax_sensitivity.csv
          git add results/jp_gamma25_common_mean/paper_export/dtcmv_xmax_sensitivity.csv
          git commit -m 'Export recalibrated dTCMV x-max sensitivity [skip export jp]'
          git push origin HEAD:agent/jp-gamma25-common-mean
